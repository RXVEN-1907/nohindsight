<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <title>nohindsight - two clocks: event time vs knowledge time</title>
  <defs>
    <marker id="arr-lav" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D0C4DF"/>
    </marker>
    <marker id="arr-crim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E5484D"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#0B0C10"/>

  <!-- header -->
  <text><tspan x="72" y="64" font-size="20" font-weight="bold" fill="#F2F3F7">two clocks</tspan><tspan x="72" y="90" font-size="12.5" fill="#8A8FA3">every datum exists twice: as an event, and as knowledge</tspan></text>
  <text text-anchor="end" font-size="11" fill="#8A8FA3"><tspan x="1128" y="60">fig. 01 / RESTATEMENT_LEAK</tspan><tspan x="1128" y="80">key: SYM2.revenue</tspan></text>

  <!-- event_time: what happened in the world -->
  <text x="72" y="168" font-size="12" fill="#8A8FA3">event_time</text>
  <line x1="72" y1="206" x2="1128" y2="206" stroke="#2A2D3A" stroke-width="1.5"/>
  <g stroke="#2A2D3A" stroke-width="1" opacity="0.55">
    <line x1="160" y1="203" x2="160" y2="209"/><line x1="374" y1="203" x2="374" y2="209"/><line x1="588" y1="203" x2="588" y2="209"/>
    <line x1="844" y1="203" x2="844" y2="209"/><line x1="1040" y1="203" x2="1040" y2="209"/>
  </g>
  <line x1="72" y1="200" x2="72" y2="212" stroke="#2A2D3A" stroke-width="1.5"/>
  <line x1="1128" y1="200" x2="1128" y2="212" stroke="#2A2D3A" stroke-width="1.5"/>

  <line x1="168" y1="200" x2="168" y2="212" stroke="#8A8FA3" stroke-width="1.5"/>
  <text x="168" y="236" font-size="11" fill="#8A8FA3" text-anchor="middle">quarter close 2023-12-31</text>

  <line x1="717" y1="200" x2="717" y2="212" stroke="#D0C4DF" stroke-width="2"/>
  <text x="749" y="188" font-size="11" text-anchor="end"><tspan fill="#8A8FA3">filed 2024-02-09: </tspan><tspan fill="#D0C4DF">253.4</tspan></text>

  <rect x="900" y="148" width="208" height="24" fill="#12141C" stroke="#E6B455" stroke-width="1.25"/>
  <line x1="1004" y1="172" x2="1004" y2="200" stroke="#E6B455" stroke-width="1" opacity="0.6"/>
  <line x1="1004" y1="200" x2="1004" y2="212" stroke="#E6B455" stroke-width="2"/>
  <text x="1004" y="164" font-size="11" text-anchor="middle"><tspan fill="#8A8FA3">restated 2024-03-01: </tspan><tspan fill="#E6B455">177.4</tspan></text>

  <!-- the backtest playhead -->
  <rect x="600" y="96" width="158" height="22" fill="#12141C" stroke="#D0C4DF" stroke-width="1.25"/>
  <text x="679" y="111" font-size="11.5" fill="#D0C4DF" text-anchor="middle">backtest now: FEB 12</text>
  <line x1="758" y1="118" x2="758" y2="404" stroke="#D0C4DF" stroke-width="1.5"/>

  <!-- knowledge_time: when the data could be known -->
  <text x="72" y="358" font-size="12" fill="#8A8FA3">knowledge_time</text>
  <line x1="72" y1="380" x2="1128" y2="380" stroke="#2A2D3A" stroke-width="1.5"/>
  <g stroke="#2A2D3A" stroke-width="1" opacity="0.55">
    <line x1="160" y1="377" x2="160" y2="383"/><line x1="374" y1="377" x2="374" y2="383"/><line x1="588" y1="377" x2="588" y2="383"/>
    <line x1="844" y1="377" x2="844" y2="383"/><line x1="1040" y1="377" x2="1040" y2="383"/>
  </g>
  <line x1="72" y1="374" x2="72" y2="386" stroke="#2A2D3A" stroke-width="1.5"/>
  <line x1="1128" y1="374" x2="1128" y2="386" stroke="#2A2D3A" stroke-width="1.5"/>
  <line x1="195" y1="374" x2="195" y2="386" stroke="#E5484D" stroke-width="2"/>
  <text x="167" y="422" font-size="11"><tspan fill="#E5484D">2024-01-02: </tspan><tspan fill="#8A8FA3">the first of 43 decision days reading the future</tspan></text>

  <!-- the two reads -->
  <path d="M 717 216 C 730 268, 742 322, 755 374" fill="none" stroke="#D0C4DF" stroke-width="2" marker-end="url(#arr-lav)"/>
  <text x="770" y="256" font-size="11" fill="#D0C4DF">reads the past</text>
  <path d="M 1004 218 C 830 300, 420 340, 200 372" fill="none" stroke="#E5484D" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-crim)"/>
  <text x="720" y="336" font-size="11" fill="#E5484D" text-anchor="end">reads the future</text>

  <!-- the two answers -->
  <rect x="72" y="476" width="266" height="58" fill="#12141C" stroke="#D0C4DF" stroke-width="1.25"/>
  <text><tspan x="88" y="498" font-size="13" fill="#8A8FA3">what the guard returns: </tspan><tspan font-size="13" font-weight="bold" fill="#D0C4DF">253.4</tspan><tspan x="88" y="519" font-size="11" fill="#8A8FA3">the number the world had on FEB 12</tspan></text>

  <rect x="795" y="476" width="333" height="58" fill="#12141C" stroke="#E5484D" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text><tspan x="811" y="498" font-size="13" fill="#8A8FA3">what a naive merge returns: </tspan><tspan font-size="13" font-weight="bold" fill="#E5484D">177.4</tspan><tspan x="811" y="519" font-size="10.5" fill="#8A8FA3">published 2024-03-01, read up to 58 days early</tspan></text>
</svg>
