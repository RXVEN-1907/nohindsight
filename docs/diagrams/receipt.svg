<text x="28" y="464" fill="#D0C4DF" font-size="16">The naive strategy made more money. It was reading a number</text>
<text x="28" y="488" fill="#D0C4DF" font-size="16">the world did not have yet. That is the whole problem.</text>
<text x="28" y="536" fill="#4A4E63" font-size="12">receipt: RESTATEMENT_LEAK on SYM2.revenue · first read 2024-01-02 · published 2024-03-01</text>
