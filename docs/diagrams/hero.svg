<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D0C4DF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#D0C4DF" stop-opacity="0"/>
    </linearGradient>
    <marker id="h-crim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E5484D"/>
    </marker>
  </defs>

  <rect width="1280" height="400" fill="#0B0C10"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- faint hairlines, like ruled paper for data -->
  <g stroke="#161822" stroke-width="1">
    <line x1="0" y1="96"  x2="1280" y2="96"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="304" x2="1280" y2="304"/>
  </g>

  <!-- wordmark: the name is the joke -->
  <text x="72" y="172" font-size="72" font-weight="bold" letter-spacing="2">
    <tspan fill="#D0C4DF">no</tspan><tspan fill="#F2F3F7">hindsight</tspan>
  </text>
  <!-- the strike: hindsight is the crime -->
  <line x1="172" y1="148" x2="676" y2="148" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <circle cx="676" cy="148" r="6" fill="#E5484D"/>
  <text x="696" y="140" fill="#E5484D" font-size="13">← the leak lives here</text>

  <text x="74" y="216" fill="#8A8FA3" font-size="20">is your strategy real, or did you cheat by accident?</text>

  <!-- the two clocks, miniature -->
  <g transform="translate(806,84)">
    <text x="0" y="0" fill="#5A5F72" font-size="12">event_time</text>
    <line x1="0" y1="14" x2="404" y2="14" stroke="#2A2D3A" stroke-width="2"/>
    <rect x="36" y="4" width="12" height="20" rx="2" fill="#705EB1"/>
    <rect x="196" y="4" width="12" height="20" rx="2" fill="#705EB1"/>
    <rect x="330" y="4" width="12" height="20" rx="2" fill="#705EB1"/>

    <text x="0" y="86" fill="#5A5F72" font-size="12">knowledge_time</text>
    <line x1="0" y1="100" x2="404" y2="100" stroke="#2A2D3A" stroke-width="2"/>
    <rect x="98" y="90" width="12" height="20" rx="2" fill="#D0C4DF"/>
    <rect x="262" y="90" width="12" height="20" rx="2" fill="#E6B455"/>
    <rect x="368" y="90" width="12" height="20" rx="2" fill="#D0C4DF"/>

    <line x1="150" y1="34" x2="150" y2="124" stroke="#D0C4DF" stroke-width="2"/>
    <path d="M152,40 C210,58 240,72 258,88" stroke="#E5484D" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#h-crim)"/>
    <text x="196" y="60" fill="#E5484D" font-size="12">the leak</text>
    <text x="120" y="146" fill="#D0C4DF" font-size="12">now - and not one datum further</text>
  </g>

  <!-- footer strip -->
  <g font-size="14" fill="#8A8FA3">
    <text x="74" y="330">point-in-time data</text>
    <text x="74" y="352" fill="#4A4E63" font-size="12">ledgers that know when they were known</text>
    <text x="360" y="330">leak guards</text>
    <text x="360" y="352" fill="#4A4E63" font-size="12">looking at the future is an error, not a warning</text>
    <text x="720" y="330">real costs · real statistics</text>
    <text x="720" y="352" fill="#4A4E63" font-size="12">σ√(Q/ADV) impact · deflated Sharpe · PBO</text>
  </g>

  <text x="1206" y="382" fill="#4A4E63" font-size="13" text-anchor="end">python research api · rust engine · zero dependencies</text>
</svg>
