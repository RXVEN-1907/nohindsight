<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <title>nohindsight - point-in-time backtesting without the leak</title>
  <defs>
    <marker id="arr-crim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E5484D"/>
    </marker>
  </defs>

  <rect width="1400" height="420" fill="#0B0C10"/>

  <!-- the name is the thesis: hindsight, struck out -->
  <text x="96" y="244" font-size="84" font-weight="bold"><tspan fill="#D0C4DF">no</tspan><tspan fill="#F2F3F7">hindsight</tspan></text>
  <line x1="201" y1="222" x2="800" y2="222" stroke="#E5484D" stroke-width="3"/>
  <text x="96" y="306" font-size="15" fill="#8A8FA3">is your strategy real, or did it cheat by accident?</text>

  <!-- two-track timeline, right half: the same story on two clocks -->
  <text x="800" y="150" font-size="11.5" fill="#8A8FA3">event_time</text>
  <line x1="800" y1="168" x2="1330" y2="168" stroke="#2A2D3A" stroke-width="1"/>
  <text x="800" y="288" font-size="11.5" fill="#8A8FA3">knowledge_time</text>
  <line x1="800" y1="306" x2="1330" y2="306" stroke="#2A2D3A" stroke-width="1"/>
  <g stroke="#2A2D3A" stroke-width="1" opacity="0.55">
    <line x1="853" y1="165" x2="853" y2="171"/><line x1="853" y1="303" x2="853" y2="309"/>
    <line x1="906" y1="165" x2="906" y2="171"/><line x1="906" y1="303" x2="906" y2="309"/>
    <line x1="959" y1="165" x2="959" y2="171"/><line x1="959" y1="303" x2="959" y2="309"/>
    <line x1="1012" y1="165" x2="1012" y2="171"/><line x1="1012" y1="303" x2="1012" y2="309"/>
    <line x1="1065" y1="165" x2="1065" y2="171"/><line x1="1065" y1="303" x2="1065" y2="309"/>
    <line x1="1118" y1="165" x2="1118" y2="171"/><line x1="1118" y1="303" x2="1118" y2="309"/>
    <line x1="1171" y1="165" x2="1171" y2="171"/><line x1="1171" y1="303" x2="1171" y2="309"/>
    <line x1="1224" y1="165" x2="1224" y2="171"/><line x1="1224" y1="303" x2="1224" y2="309"/>
    <line x1="1277" y1="165" x2="1277" y2="171"/><line x1="1277" y1="303" x2="1277" y2="309"/>
  </g>

  <!-- events at 9 px per day: FEB 09, then FEB 12, then MAR 01 -->
  <line x1="980" y1="162" x2="980" y2="174" stroke="#D0C4DF" stroke-width="2"/>
  <text x="972" y="204" font-size="11" fill="#8A8FA3" text-anchor="end">filed FEB 09</text>
  <line x1="1160" y1="162" x2="1160" y2="174" stroke="#E5484D" stroke-width="2"/>
  <text x="1168" y="204" font-size="11" fill="#8A8FA3">restated MAR 01</text>

  <!-- the playhead is now; the arc is what a naive merge reaches for -->
  <line x1="1007" y1="124" x2="1007" y2="330" stroke="#D0C4DF" stroke-width="1.5"/>
  <line x1="1003" y1="124" x2="1011" y2="124" stroke="#D0C4DF" stroke-width="1.5"/>
  <text x="999" y="348" font-size="11" fill="#D0C4DF" text-anchor="end">now: FEB 12</text>
  <path d="M 1007 154 C 1050 116, 1116 114, 1154 148" fill="none" stroke="#E5484D" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arr-crim)"/>
  <text x="1084" y="96" font-size="10.5" fill="#E5484D" text-anchor="middle">the leak: 58 days early</text>

  <!-- folio line -->
  <line x1="96" y1="376" x2="1304" y2="376" stroke="#2A2D3A" stroke-width="1"/>
  <text x="96" y="398" font-size="12" fill="#8A8FA3">point-in-time data</text>
  <text x="760" y="398" font-size="12" fill="#8A8FA3">leak guards</text>
  <text x="1304" y="398" font-size="12" fill="#8A8FA3" text-anchor="end">deflated sharpe</text>
</svg>
