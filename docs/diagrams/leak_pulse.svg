<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <title>nohindsight - the leak, in motion</title>
  <defs>
    <marker id="arr-crim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E5484D"/>
    </marker>
  </defs>

  <rect width="940" height="300" fill="#0B0C10"/>

  <!-- the future window, pulsing: from backtest now to the restatement.
       fill values are crimson #E5484D pre-blended over the #0B0C10 canvas
       at alpha 0.05, 0.09, 0.13, so the pulse survives every renderer. -->
  <rect x="494" y="92" width="144" height="142" fill="#1F1115">
    <animate attributeName="fill" values="#160F13;#271418;#160F13" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- event_time: what happened -->
  <text x="96" y="86" font-size="11" fill="#8A8FA3">event_time</text>
  <line x1="96" y1="102" x2="844" y2="102" stroke="#2A2D3A" stroke-width="1.5"/>
  <g stroke="#2A2D3A" stroke-width="1" opacity="0.55">
    <line x1="158" y1="99" x2="158" y2="105"/><line x1="282" y1="99" x2="282" y2="105"/><line x1="406" y1="99" x2="406" y2="105"/>
    <line x1="530" y1="99" x2="530" y2="105"/><line x1="654" y1="99" x2="654" y2="105"/><line x1="778" y1="99" x2="778" y2="105"/>
  </g>
  <line x1="96" y1="96" x2="96" y2="108" stroke="#2A2D3A" stroke-width="1.5"/>
  <line x1="844" y1="96" x2="844" y2="108" stroke="#2A2D3A" stroke-width="1.5"/>

  <line x1="470" y1="96" x2="470" y2="108" stroke="#D0C4DF" stroke-width="2"/>
  <text x="462" y="132" font-size="11" fill="#8A8FA3" text-anchor="end">filed FEB 09</text>

  <!-- the restatement, breathing -->
  <circle cx="638" cy="102" r="5" fill="none" stroke="#E5484D" stroke-width="1">
    <animate attributeName="r" values="5;13" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="638" cy="102" r="5" fill="#E5484D">
    <animate attributeName="r" values="3.5;6.5;3.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="638" y="80" font-size="11" fill="#8A8FA3" text-anchor="middle">restated MAR 01</text>

  <!-- knowledge_time: when it could be known -->
  <text x="96" y="200" font-size="11" fill="#8A8FA3">knowledge_time</text>
  <line x1="96" y1="216" x2="844" y2="216" stroke="#2A2D3A" stroke-width="1.5"/>
  <g stroke="#2A2D3A" stroke-width="1" opacity="0.55">
    <line x1="158" y1="213" x2="158" y2="219"/><line x1="282" y1="213" x2="282" y2="219"/><line x1="406" y1="213" x2="406" y2="219"/>
    <line x1="530" y1="213" x2="530" y2="219"/><line x1="654" y1="213" x2="654" y2="219"/><line x1="778" y1="213" x2="778" y2="219"/>
  </g>
  <line x1="96" y1="210" x2="96" y2="222" stroke="#2A2D3A" stroke-width="1.5"/>
  <line x1="844" y1="210" x2="844" y2="222" stroke="#2A2D3A" stroke-width="1.5"/>

  <!-- backtest now -->
  <rect x="348" y="48" width="146" height="20" fill="#12141C" stroke="#D0C4DF" stroke-width="1.25"/>
  <text x="421" y="62" font-size="10.5" fill="#D0C4DF" text-anchor="middle">backtest now: FEB 12</text>
  <line x1="494" y1="68" x2="494" y2="250" stroke="#D0C4DF" stroke-width="1.5"/>
  <line x1="490" y1="68" x2="498" y2="68" stroke="#D0C4DF" stroke-width="1.5"/>

  <!-- the leak: the future value marching back into the naive present -->
  <path d="M 638 110 C 620 168, 566 188, 500 210" fill="none" stroke="#E5484D" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arr-crim)">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- the two answers -->
  <text x="96" y="266" font-size="12"><tspan fill="#8A8FA3">the guard returns </tspan><tspan fill="#D0C4DF" font-weight="bold">253.4</tspan><tspan fill="#8A8FA3"> - what the world had</tspan></text>
  <text x="844" y="266" font-size="12" text-anchor="end"><tspan fill="#8A8FA3">a naive merge returns </tspan><tspan fill="#E5484D" font-weight="bold">177.4</tspan><tspan fill="#8A8FA3"> - 58 days early</tspan></text>
</svg>
