<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <rect width="940" height="300" fill="#0B0C10"/>
  <text x="28" y="40" fill="#F2F3F7" font-size="17">the leak, in motion</text>
  <text x="28" y="62" fill="#8A8FA3" font-size="12.5">honest data holds. the crimson read reaches into the future on a loop.</text>

  <!-- leak band, breathing -->
  <rect x="360" y="86" width="180" height="150" fill="#E5484D">
    <animate attributeName="opacity" values="0.05;0.14;0.05" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- knowledge_time track -->
  <text x="28" y="112" fill="#5A5F72" font-size="11.5">knowledge_time</text>
  <line x1="200" y1="126" x2="880" y2="126" stroke="#2A2D3A" stroke-width="2"/>
  <rect x="330" y="120" width="10" height="12" rx="2" fill="#D0C4DF"/>
  <text x="316" y="150" fill="#8A8FA3" font-size="11">filed FEB 09</text>
  <rect x="560" y="120" width="10" height="12" rx="2" fill="#E6B455"/>
  <text x="542" y="150" fill="#8A8FA3" font-size="11">restated MAR 01</text>

  <!-- event_time track -->
  <text x="28" y="186" fill="#5A5F72" font-size="11.5">event_time</text>
  <line x1="200" y1="200" x2="880" y2="200" stroke="#2A2D3A" stroke-width="2"/>
  <rect x="260" y="194" width="10" height="12" rx="2" fill="#705EB1"/>
  <text x="238" y="224" fill="#8A8FA3" font-size="11">quarter closed DEC 31</text>

  <!-- playhead: backtest now -->
  <line x1="420" y1="106" x2="420" y2="226" stroke="#D0C4DF" stroke-width="2"/>
  <circle cx="420" cy="106" r="4" fill="#D0C4DF"/>
  <text x="336" y="96" fill="#D0C4DF" font-size="11.5">backtest now: FEB 12</text>

  <!-- honest read: steady -->
  <line x1="420" y1="106" x2="335" y2="120" stroke="#D0C4DF" stroke-width="2"/>
  <text x="242" y="262" fill="#D0C4DF" font-size="12.5">honest: reads 253.4, the number the world had</text>

  <!-- the leak: marching dashes toward the future revision -->
  <line x1="424" y1="106" x2="565" y2="120" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.4s" repeatCount="indefinite"/>
  </line>
  <circle cx="565" cy="126" r="5" fill="#E5484D">
    <animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="262" fill="#E5484D" font-size="12.5">naive: reads 177.4, seventeen days early, silently</text>

  <text x="912" y="284" fill="#4A4E63" font-size="11" text-anchor="end">SMIL, no scripts, loops forever</text>
</svg>
