name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib suite)
        run: python -m unittest discover -s tests -v
      - name: Smoke the CLI
        run: |
          python -m nohindsight version
          python -m nohindsight demo --output /tmp/nh-demo
