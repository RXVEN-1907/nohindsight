[package]
name = "nh"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "nohindsight engine - Python is the research API, Rust is the engine."
license = "MIT"

# Zero dependencies by contract: the two-clock guard, the forensics and the
# costs are all built on std alone.  No chrono (Time is i64 nanos + a small
# ISO-8601 parser), no rand (splitmix64), no clap (hand-rolled argparse).

[lib]
name = "nh"
path = "src/lib.rs"

[[bin]]
name = "nh"
path = "src/main.rs"
